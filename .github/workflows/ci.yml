name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: abp
          POSTGRES_PASSWORD: abp
          POSTGRES_DB: abp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U abp -d abp_test" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      ABP_DATABASE_URL: postgresql+psycopg://abp:abp@localhost:5432/abp_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check app tests migrations
          ruff format --check app tests migrations
      - name: Type check
        run: mypy app
      - name: Tests (real PostgreSQL, offline reasoner)
        run: pytest --cov=app --cov-report=term --cov-report=xml
      - name: Agent evaluation gate (labelled cases, safety checks, injected failures)
        env:
          ABP_JWT_SECRET: test-secret-not-for-production-0123456789abcdef
          ABP_LLM_PROVIDER: offline
          ABP_LOG_LEVEL: ERROR
        run: python -m app.cli evaluate --reset --gate --out /tmp/eval
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Container images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t pdm-api backend
      - run: docker build -t pdm-web frontend

  terraform:
    name: Terraform (fmt, validate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  secrets-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Run the gitleaks CLI over the full history. (gitleaks-action scans "<first commit>^..HEAD",
      # which fails on a repository's very first push because the root commit has no parent.)
      - name: Scan full git history
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .
